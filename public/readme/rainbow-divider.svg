<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="100%" height="12">
  <defs>
    <linearGradient id="rbLine" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="16%" stop-color="#ff9a00" />
      <stop offset="33%" stop-color="#f6f930" />
      <stop offset="50%" stop-color="#05d550" />
      <stop offset="66%" stop-color="#00b4d8" />
      <stop offset="83%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#ff2a6d" />
